[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "leash"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116",
    "httpx>=0.28",
    "mcp>=2.2,<3",
    "pydantic>=2.11",
    "uvicorn>=0.35",
]

[dependency-groups]
classifier = [
    "numpy>=2.2",
    "scikit-learn>=1.6",
    "catboost>=1.2.8",
]

[tool.setuptools.packages.find]
where = ["src"]
