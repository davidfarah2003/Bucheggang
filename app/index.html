<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f5f1" />
  <meta name="description" content="Shop with an agent and review its spending permissions in Viseca Wallet." />
  <title>Viseca+ | Shop and Wallet</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./identity.css" />
  <link rel="stylesheet" href="./pair-code.css" />
  <link rel="stylesheet" href="./harness.css" />
  <link rel="stylesheet" href="./global-rules.css" />
  <script src="./api.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <button class="wordmark" type="button" data-route="shop" aria-label="Viseca+ Shop">viseca<span>+</span></button>
      <button class="account-button" type="button" data-action="account" aria-label="Account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M5.5 20v-2c0-3.2 2.8-5.5 6.5-5.5s6.5 2.3 6.5 5.5v2"/></svg></button>
    </header>
    <main id="main-content" tabindex="-1">
      <div id="screen" aria-live="polite" aria-busy="true"><div class="loading-state"><span class="spinner" aria-hidden="true"></span>Opening Wallet…</div></div>
    </main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <button type="button" data-route="shop" class="nav-button is-active" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 8h16l-1 13H5L4 8Z"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/></svg><span>Shop</span></button>
      <button type="button" data-route="wallet" class="nav-button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h14v4M3 7h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/><path d="M17 13h4v4h-4a2 2 0 1 1 0-4Z"/></svg><span>Wallet</span><i id="wallet-indicator" hidden></i></button>
      <button type="button" data-route="activity" class="nav-button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 20V11M12 20V4M20 20v-9"/></svg><span>Activity</span></button>
    </nav>
  </div>
  <div id="overlay-root"></div>
  <div id="toast-root" class="toast-root" aria-live="assertive" aria-atomic="true"></div>
</body>
</html>
