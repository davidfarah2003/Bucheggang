<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f3ee" />
    <meta name="description" content="Review and control purchases made by your shopping agent." />
    <title>Viseca · Agent control</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="app-frame">
      <aside class="rail" aria-label="Main navigation">
        <a class="brand" href="#home" aria-label="Viseca home">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span class="brand-word">viseca<span>+</span></span>
        </a>

        <div class="rail-label">YOUR WALLET</div>
        <nav class="primary-nav">
          <button class="nav-item is-active" type="button" data-route="home">
            <span class="nav-icon icon-inbox" aria-hidden="true"></span><span>Home</span>
          </button>
          <button class="nav-item" type="button" data-route="approvals">
            <span class="nav-icon icon-shield" aria-hidden="true"></span><span>Approvals</span><span class="nav-count nav-count-muted" id="approval-count">—</span>
          </button>
          <button class="nav-item" type="button" data-route="policy">
            <span class="nav-icon icon-sliders" aria-hidden="true"></span><span>My policy</span>
          </button>
          <button class="nav-item" type="button" data-route="activity">
            <span class="nav-icon icon-clock" aria-hidden="true"></span><span>Activity</span>
          </button>
        </nav>

        <div class="rail-bottom">
          <div class="profile-row">
            <span class="avatar" id="profile-avatar">?</span>
            <span class="profile-copy"><strong id="profile-name">Local account</strong><small>Demo account</small></span>
            <button class="profile-menu" type="button" data-action="logout" hidden>Sign out</button>
          </div>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <div class="mobile-brand">
            <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
            <span class="brand-word">viseca<span>+</span></span>
          </div>
          <div class="topbar-context"><span class="status-dot"></span><span>Agent control</span><span class="context-separator">/</span><span id="page-context">Home</span></div>
          <div class="topbar-actions">
            <span class="secure-label"><span class="lock-icon" aria-hidden="true"></span>Local demo session</span>
            <span class="avatar top-avatar" id="top-avatar" aria-label="Local account">?</span>
            <button class="button button-quiet button-small" type="button" data-action="logout" hidden>Sign out</button>
          </div>
        </header>

        <main id="main-content" class="main-content" tabindex="-1">
          <div id="screen" class="screen" aria-live="polite" aria-busy="true">
            <div class="loading-panel"><span class="spinner" aria-hidden="true"></span><span>Loading wallet…</span></div>
          </div>
        </main>
        <footer class="footer-note"><span>Viseca control demo</span><span>Local demo account · no payment credentials stored here</span></footer>
      </div>
    </div>

    <nav class="mobile-nav" aria-label="Main navigation">
      <button class="mobile-nav-item is-active" type="button" data-route="home"><span class="nav-icon icon-inbox" aria-hidden="true"></span><span>Home</span></button>
      <button class="mobile-nav-item" type="button" data-route="approvals"><span class="nav-icon icon-shield" aria-hidden="true"></span><span>Approvals</span></button>
      <button class="mobile-nav-item" type="button" data-route="policy"><span class="nav-icon icon-sliders" aria-hidden="true"></span><span>Policy</span></button>
      <button class="mobile-nav-item" type="button" data-route="activity"><span class="nav-icon icon-clock" aria-hidden="true"></span><span>Activity</span></button>
    </nav>

    <div id="drawer-root"></div>
    <div id="toast-root" class="toast-root" aria-live="assertive" aria-atomic="true"></div>
  </body>
</html>
