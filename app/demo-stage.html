<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Leash demo stage</title>
<style>
  :root { --ink: #101418; --red: #c8102e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: clip; }
  body {
    width: 1600px; height: 900px; position: relative;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: linear-gradient(120deg, #ff8a3d 0%, #ff3d6e 45%, #7b3dff 100%);
    background-size: 220% 220%;
    animation: drift 20s ease-in-out infinite alternate;
  }
  @keyframes drift { from { background-position: 0% 0%; } to { background-position: 100% 100%; } }
  .glow { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .5; pointer-events: none; }
  .glow.a { width: 640px; height: 640px; left: -180px; top: -220px; background: #ffd166; animation: floatA 14s ease-in-out infinite alternate; }
  .glow.b { width: 600px; height: 600px; right: -140px; bottom: -240px; background: #4dd0ff; animation: floatB 17s ease-in-out infinite alternate; }
  @keyframes floatA { to { transform: translate(80px, 60px) scale(1.1); } }
  @keyframes floatB { to { transform: translate(-70px, -40px) scale(1.06); } }

  /* Camera: everything on the stage lives inside it so a zoom moves the whole composition. */
  #camera { position: absolute; inset: 0; transform-origin: 0 0; will-change: transform; transition: transform .9s cubic-bezier(.2,.8,.2,1); }

  /* Scenes */
  .title {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: #fff; z-index: 40;
    opacity: 0; pointer-events: none; transition: opacity .5s ease;
  }
  .title.show { opacity: 1; }
  .title h1 { margin: 0; font-size: 112px; font-weight: 800; letter-spacing: -.045em; line-height: .98; text-shadow: 0 6px 40px rgba(0,0,0,.25);
    transform: translateY(40px) scale(.94); opacity: 0; transition: transform .7s cubic-bezier(.2,.9,.2,1), opacity .5s ease; }
  .title p { margin: 22px 0 0; font-size: 34px; font-weight: 600; opacity: 0; transform: translateY(20px); transition: transform .6s cubic-bezier(.2,.9,.2,1) .25s, opacity .5s ease .25s; }
  .title.show h1, .title.show p { transform: none; opacity: 1; }
  .title.show p { opacity: .95; }
  .title .credit { position: absolute; left: 0; right: 0; bottom: 34px; font-size: 16px; font-weight: 500; opacity: 0; transition: opacity .6s ease .5s; }
  .title.show .credit { opacity: .75; }

  .headline { position: absolute; left: 80px; top: 52px; color: #fff; text-shadow: 0 2px 24px rgba(0,0,0,.18);
    transform: translateY(-30px); opacity: 0; transition: transform .6s cubic-bezier(.2,.9,.2,1), opacity .5s ease; }
  .headline.show { transform: none; opacity: 1; }
  .headline h1 { margin: 0; font-size: 42px; font-weight: 800; letter-spacing: -.035em; line-height: 1.05; }
  .headline p { margin: 6px 0 0; font-size: 19px; font-weight: 500; opacity: .92; }

  .lead {
    position: absolute; left: 80px; top: 300px; width: 660px; color: #fff; z-index: 30;
    font-size: 64px; font-weight: 800; letter-spacing: -.04em; line-height: 1.02; text-shadow: 0 6px 40px rgba(0,0,0,.25);
    opacity: 0; transform: translateY(28px); transition: opacity .45s ease, transform .6s cubic-bezier(.2,.9,.2,1);
  }
  .lead.show { opacity: 1; transform: none; }
  .lead small { display: block; margin-top: 18px; font-size: 26px; font-weight: 600; letter-spacing: -.01em; opacity: .92; line-height: 1.25; }
  .lead .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
  .lead .chip { font-size: 20px; font-weight: 700; letter-spacing: -.01em; padding: 10px 18px; border-radius: 999px; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.45); backdrop-filter: blur(6px);
    opacity: 0; transform: translateY(14px); transition: opacity .35s ease, transform .45s cubic-bezier(.2,.9,.2,1); }
  .lead.show .chip { opacity: 1; transform: none; }
  .lead.show .chip:nth-child(1) { transition-delay: .25s; } .lead.show .chip:nth-child(2) { transition-delay: .4s; } .lead.show .chip:nth-child(3) { transition-delay: .55s; } .lead.show .chip:nth-child(4) { transition-delay: .7s; }
  .lead .chip.mcp { background: #fff; color: var(--red); border-color: #fff; }
  .lead.tech { top: 170px; width: 620px; font-size: 44px; }
  .lead .steps { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
  .lead .step { display: grid; grid-template-columns: 44px 1fr; gap: 14px; align-items: start; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.35); backdrop-filter: blur(6px);
    opacity: 0; transform: translateX(-18px); transition: opacity .35s ease, transform .45s cubic-bezier(.2,.9,.2,1); }
  .lead.show .step { opacity: 1; transform: none; }
  .lead.show .step:nth-child(1) { transition-delay: .2s; } .lead.show .step:nth-child(2) { transition-delay: .5s; } .lead.show .step:nth-child(3) { transition-delay: .8s; } .lead.show .step:nth-child(4) { transition-delay: 1.1s; }
  .lead .step b { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: #fff; color: var(--red); font-size: 20px; font-weight: 800; letter-spacing: 0; }
  .lead .step strong { display: block; font-size: 21px; font-weight: 750; letter-spacing: -.015em; line-height: 1.2; }
  .lead .step span { display: block; margin-top: 3px; font-size: 16px; font-weight: 500; opacity: .9; line-height: 1.3; letter-spacing: 0; }

  .caption {
    position: absolute; left: 60px; right: 60px; bottom: 44px; text-align: center; color: #fff; z-index: 35;
    font-size: 34px; font-weight: 800; letter-spacing: -.025em; text-shadow: 0 4px 28px rgba(0,0,0,.28);
    opacity: 0; transform: translateY(16px) scale(.97); transition: opacity .32s ease, transform .4s cubic-bezier(.2,.9,.2,1);
  }
  .caption.show { opacity: 1; transform: none; }
  .caption.side { left: 60px; right: auto; bottom: auto; top: 300px; width: 520px; text-align: left; font-size: 38px; line-height: 1.12; }

  /* Agent panel (left) */
  .agent-panel {
    position: absolute; left: 80px; top: 172px; width: 640px; height: 620px;
    border-radius: 30px; background: rgba(16, 20, 26, .78);
    border: 1px solid rgba(255,255,255,.22); box-shadow: 0 30px 80px rgba(0,0,0,.35);
    padding: 24px 26px; display: flex; flex-direction: column; gap: 12px; color: #fff; overflow: hidden;
    transform: translateX(-120%) rotate(-3deg); opacity: 0; transition: transform .75s cubic-bezier(.2,.9,.2,1), opacity .5s ease, box-shadow .4s ease;
  }
  .agent-panel.show { transform: none; opacity: 1; }
  .agent-panel.show.dim { opacity: .12; }
  .agent-panel.flash { box-shadow: 0 30px 80px rgba(0,0,0,.35), 0 0 0 4px rgba(72,240,160,.55); }
  .agent-panel.flash.bad { box-shadow: 0 30px 80px rgba(0,0,0,.35), 0 0 0 4px rgba(255,96,96,.7); }
  .agent-panel.flash.ask { box-shadow: 0 30px 80px rgba(0,0,0,.35), 0 0 0 4px rgba(255,209,102,.7); }
  .agent-panel header { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 18px; letter-spacing: -.01em; flex: none; }
  .agent-panel header .dot { width: 12px; height: 12px; border-radius: 50%; background: #48f0a0; box-shadow: 0 0 0 4px rgba(72,240,160,.25); }
  .agent-panel header .mcp { margin-left: auto; font-weight: 700; font-size: 13px; letter-spacing: .04em; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3); }
  .log { display: flex; flex-direction: column; gap: 10px; justify-content: flex-end; flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .msg {
    flex: 0 0 auto; max-width: 92%; padding: 13px 17px; border-radius: 20px; font-size: 19px; line-height: 1.32; font-weight: 500;
    opacity: 0; transform: translateY(16px) scale(.97); transition: opacity .3s ease, transform .4s cubic-bezier(.2,.9,.2,1);
  }
  .msg.show { opacity: 1; transform: none; }
  .msg.user { align-self: flex-end; background: #fff; color: var(--ink); border-bottom-right-radius: 6px; }
  .msg.agent { align-self: flex-start; background: rgba(255,255,255,.14); color: #fff; border-bottom-left-radius: 6px; }
  .msg.agent.bad { background: rgba(255,80,80,.3); box-shadow: inset 4px 0 0 #ff6b6b; }
  .msg.agent.ask { background: rgba(255,209,102,.18); box-shadow: inset 4px 0 0 #ffd166; }
  .msg.tool { align-self: flex-start; background: rgba(0,0,0,.5); color: #d9fbe8; font: 500 15px/1.4 "SF Mono", Menlo, Consolas, monospace; padding: 9px 13px; border-radius: 12px; }
  .msg.tool b { color: #fff; font-weight: 700; }
  .msg.tool .tag { display: inline-block; margin-right: 8px; padding: 1px 6px; border-radius: 6px; background: rgba(255,255,255,.16); color: #fff; font-size: 11px; letter-spacing: .06em; vertical-align: 1px; }
  .msg.tool .wait { display: inline-block; width: 8px; height: 8px; margin-left: 8px; border-radius: 50%; background: #ffd166; animation: pulse .9s ease-in-out infinite; vertical-align: middle; }
  @keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }
  .msg.tool.done .wait { display: none; }
  .msg.tool.done::after { content: " ✓"; color: #48f0a0; font-weight: 700; }
  .msg.tool.done.bad::after { content: " ✗ declined"; color: #ff6b6b; }
  .msg.tool.done.ask::after { content: " ? needs Alex"; color: #ffd166; }

  /* Phone (right) */
  .phone {
    position: absolute; right: 120px; top: 84px; width: 430px; height: 880px; transform: translateX(120%) rotate(4deg) scale(.82); transform-origin: top center;
    border-radius: 54px; background: #0b0d10; padding: 14px; box-shadow: 0 40px 100px rgba(0,0,0,.45), inset 0 0 0 2px #2a2e34;
    opacity: 0; transition: transform .8s cubic-bezier(.2,.9,.2,1) .08s, opacity .5s ease .08s;
  }
  .phone.show { transform: scale(.82); opacity: 1; }
  .phone::before { content: ""; position: absolute; left: 50%; top: 14px; width: 120px; height: 30px; margin-left: -60px; background: #0b0d10; border-radius: 0 0 20px 20px; z-index: 2; }
  .phone iframe { width: 100%; height: 100%; border: 0; border-radius: 42px; background: #fff; display: block; }

  /* Pointer: a macOS-style arrow with a tap ring. Lives in stage coordinates inside the camera. */
  #cursor { position: absolute; width: 0; height: 0; z-index: 50; pointer-events: none; left: 1200px; top: 700px; opacity: 0;
    transition: left .5s cubic-bezier(.2,.8,.2,1), top .5s cubic-bezier(.2,.8,.2,1), opacity .25s ease; }
  #cursor svg { position: absolute; left: -3px; top: -2px; width: 30px; height: 36px; filter: drop-shadow(0 3px 6px rgba(0,0,0,.35)); transition: transform .1s ease; }
  #cursor.press svg { transform: scale(.86); }
  #cursor::after { content: ""; position: absolute; left: -22px; top: -22px; width: 44px; height: 44px; border-radius: 50%; border: 3px solid #fff; background: rgba(255,255,255,.25); opacity: 0; }
  #cursor.tap::after { animation: ring .5s ease-out; }
  @keyframes ring { from { transform: scale(.4); opacity: .95; } to { transform: scale(1.5); opacity: 0; } }
</style>
</head>
<body>
  <div class="glow a"></div><div class="glow b"></div>
  <div class="headline" id="headline"><h1>Agent on a Leash</h1><p>Your shopping agent buys. Your Wallet decides.</p></div>
  <div class="lead" id="lead"></div>
  <div id="camera">
    <section class="agent-panel" id="agent">
      <header><span class="dot"></span>Grocery helper<span class="mcp">MCP client</span></header>
      <div class="log" id="log"></div>
    </section>
    <div class="phone" id="phone"><iframe id="wallet" name="wallet" src="/app/" title="Viseca Wallet"></iframe></div>
    <div id="cursor"><svg viewBox="0 0 30 36" aria-hidden="true"><path d="M3 2 L3 28 L9.5 22 L14.5 33 L19.5 31 L14.5 20.5 L23 20.5 Z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
  </div>
  <div class="caption" id="caption"></div>
  <div class="title" id="title"><div><h1 id="title-h">Agent on a Leash</h1><p id="title-p">Your agent buys. Your Wallet decides.</p></div><div class="credit" id="credit" hidden>Music: "Wallpaper" Kevin MacLeod (incompetech.com), CC BY 4.0</div></div>
  <script>
    const log = document.getElementById("log");
    const camera = document.getElementById("camera");
    const show = (id, on) => document.getElementById(id).classList.toggle("show", on);
    window.scene = (name, h, p) => {
      if (name === "title") { if (h) document.getElementById("title-h").textContent = h; if (p) document.getElementById("title-p").textContent = p; show("title", true); show("headline", false); show("agent", false); show("phone", false); }
      if (name === "stage") { show("title", false); show("headline", true); show("phone", true); }
      if (name === "lead") { const l = document.getElementById("lead"); l.innerHTML = `${h}<small>${p || ""}</small>`; show("agent", false); show("lead", true); }
      if (name === "chips") { const l = document.getElementById("lead"); l.innerHTML = `${h}<small>${p || ""}</small><div class="chips"><span class="chip mcp">MCP</span><span class="chip">Claude Code</span><span class="chip">OpenCode</span><span class="chip">your own agent</span></div>`; show("agent", false); show("lead", true); }
      if (name === "tech") { const l = document.getElementById("lead"); l.classList.add("tech"); l.innerHTML = `${h}<div class="steps">
          <div class="step"><b>1</b><div><strong>Your rules, checked by code</strong><span>Amount, weekly budget, product type, shops you already use. No model involved. Break one and the purchase stops.</span></div></div>
          <div class="step"><b>2</b><div><strong>What is in the cart</strong><span>The agent's order against the shop's own page. Hidden instructions in that page are flagged.</span></div></div>
          <div class="step"><b>3</b><div><strong>How you usually pay</strong><span>This purchase next to your card's past ones: device, shop, country, amount, how fast.</span></div></div>
          <div class="step"><b>4</b><div><strong>Two risk models</strong><span>CatBoost scores how likely a decline is. Jev says how ordinary it looks. They can only add a question. Your rules stay in charge.</span></div></div>
        </div>`; show("agent", false); show("lead", true); }
      if (name === "agent") { const l = document.getElementById("lead"); l.classList.remove("tech"); show("lead", false); show("agent", true); }
      if (name === "outro") { document.getElementById("credit").hidden = false; document.getElementById("lead").classList.remove("tech"); if (h) document.getElementById("title-h").textContent = h; if (p) document.getElementById("title-p").textContent = p; show("agent", false); show("lead", false); show("phone", false); show("headline", false); show("caption", false); setTimeout(() => show("title", true), 350); }
    };
    window.say = (kind, html) => {
      const el = document.createElement("div"); el.className = "msg " + kind; el.innerHTML = html;
      log.appendChild(el); requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("show")));
      while (log.children.length > 6) log.removeChild(log.firstChild);
    };
    window.tool = (name, args) => say("tool", `<span class="tag">MCP</span><b>${name}</b>(${args})<span class="wait"></span>`);
    // status: "ok" (green check), "ask" (amber, the Wallet wants Alex), "bad" (red cross, declined).
    window.done = (status) => { status = status || "ok"; const t = [...log.querySelectorAll(".msg.tool:not(.done)")].pop(); if (t) t.classList.add("done", status); const a = document.getElementById("agent"); a.classList.add("flash", status); setTimeout(() => a.classList.remove("flash", status), 500); };
    window.caption = (text, side) => { const c = document.getElementById("caption"); c.classList.remove("show"); document.getElementById("agent").classList.toggle("dim", !!(text && side)); setTimeout(() => { c.textContent = text; c.classList.toggle("side", !!side); if (text) c.classList.add("show"); }, 180); };
    // Camera. cam holds the target transform so points can be mapped back to stage coordinates while zoomed.
    const cam = { tx: 0, ty: 0, s: 1 };
    window.zoom = (x, y, s, ms, cx) => {
      s = s || 1; ms = ms == null ? 900 : ms; cx = cx == null ? 800 : cx;
      let tx = cx - x * s, ty = 450 - y * s;
      tx = Math.min(0, Math.max(1600 * (1 - s), tx)); ty = Math.min(0, Math.max(900 * (1 - s), ty));
      if (s === 1) { tx = 0; ty = 0; const c = document.getElementById("caption"); if (c.classList.contains("side")) { c.classList.remove("show"); document.getElementById("agent").classList.remove("dim"); } }
      Object.assign(cam, { tx, ty, s });
      camera.style.transition = `transform ${ms}ms cubic-bezier(.2,.8,.2,1)`;
      camera.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
    };
    window.toStage = (cx, cy) => [(cx - cam.tx) / cam.s, (cy - cam.ty) / cam.s];
    const cur = document.getElementById("cursor");
    window.cursor = (x, y, press) => { cur.style.opacity = "1"; cur.style.left = x + "px"; cur.style.top = y + "px"; cur.classList.toggle("press", !!press); if (press) { cur.classList.remove("tap"); void cur.offsetWidth; cur.classList.add("tap"); } };
    window.hideCursor = () => { cur.style.opacity = "0"; };
  </script>
</body>
</html>
